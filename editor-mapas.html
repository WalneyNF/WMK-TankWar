<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WMK Map Studio</title><link rel="stylesheet" href="css/game.css"><style>body{padding:12px}.editor{display:grid;grid-template-columns:260px minmax(0,1fr);gap:12px}.editor aside{padding:12px;background:#242d25}.editor label{display:block;margin:8px 0}.editor input,.editor select,.editor button{max-width:100%;padding:7px;background:#19221b;color:#eee;border:1px solid #65765a}.editor canvas{width:100%;height:auto;background:#151b15;cursor:crosshair}.editor button{margin:4px 0;cursor:pointer}output{display:block;color:#e7cb8a;padding:8px}header img{width:210px;vertical-align:middle}@media(max-width:750px){.editor{grid-template-columns:1fr}}</style><header><img src="assets/logo.webp" alt="WMK TankWar"> <strong>WMK MAP STUDIO · V1.3</strong> · <a href="index.html">Voltar ao jogo</a></header><p>Escolha uma ferramenta e clique no mapa. Pontos azuis/vermelhos correspondem às cinco posições de cada equipe. Salve e selecione o mapa no menu 3×3 / 5×5.</p><div class="editor"><aside><label>Nome <input id="name" maxlength="80"></label><label>Largura <input id="width" type="number" min="1200" max="8000"></label><label>Altura <input id="height" type="number" min="900" max="8000"></label><button id="resize">Aplicar dimensões</button><label>Ferramenta <select id="tool"><option value="building">Construção</option><option value="rock">Rocha</option><option value="blue">Spawn azul</option><option value="red">Spawn vermelho</option><option value="erase">Remover obstáculo</option></select></label><label>Índice de spawn <select id="slot"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></label><button id="undo">Desfazer</button><button id="reset">Restaurar exemplo</button><button id="save">Salvar no navegador</button><button id="export">Exportar JSON</button><button id="import">Importar JSON</button><input hidden id="file" type="file" accept=".json"><output id="status"></output></aside><main><canvas id="map" width="1000" height="700"></canvas></main></div><footer>Walney Moreira Klein — walneyk@hotmail.com · MIT</footer><script src="js/maps.js"></script><script src="js/map-editor.js"></script></html>
